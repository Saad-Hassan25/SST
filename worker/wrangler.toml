name = "yt-actions-relay"
main = "worker.js"
compatibility_date = "2024-11-01"

# --- Public config (safe to commit) -----------------------------------------
[vars]
GITHUB_OWNER = "Saad-Hassan25"
GITHUB_REPO  = "SST"
# The exact origin the browser sends, lowercase, no trailing slash, no path. Must be the
# custom domain once Pages has one: the old USERNAME.github.io/REPO URL 301-redirects to
# it, so every real request now carries the custom-domain Origin. A mismatch here fails
# as a CORS error in the browser while the page itself still loads fine.
# Redeploy the Worker after changing this — it is a [vars] value, not a secret.
ALLOWED_ORIGIN = "https://prompter.neuralforge.tech"
RATE_LIMIT_PER_HOUR = "10"

# --- Secrets (do NOT put here — set with wrangler) ---------------------------
#   wrangler secret put GITHUB_TOKEN
#     A fine-grained personal access token scoped to this one repo with the
#     "Contents" permission set to Read and write. That single permission covers
#     both firing repository_dispatch and reading releases.
#
#   wrangler secret put TURNSTILE_SECRET     # optional
#     Only if you enable Cloudflare Turnstile on the frontend. If unset, the
#     Worker skips bot verification.

# --- Per-IP rate limiting (ON) -----------------------------------------------
# Created with: wrangler kv namespace create RATE_LIMIT
# The Worker skips rate limiting entirely if this binding is missing, so removing
# it silently reopens the abuse hole. Adjust the cap via RATE_LIMIT_PER_HOUR above.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "50238c3850df4aa59c76093ff9c78621"
