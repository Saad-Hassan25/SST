name: NVIDIA Whisper bridge
on:
  repository_dispatch:
    types: [whisper]
permissions:
  contents: read
concurrency:
  group: whisper-${{ github.event.client_payload.job_id }}
  cancel-in-progress: false
jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WHISPER_JOB_ID: ${{ github.event.client_payload.job_id }}
      WHISPER_RELAY_URL: https://yt-actions-relay.yt-actions-relay.workers.dev
      WHISPER_BRIDGE_KEY: ${{ secrets.WHISPER_BRIDGE_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NVIDIA gRPC client (no model weights)
        run: pip install nvidia-riva-client==2.28.0
      - name: Transcribe private audio with NVIDIA Whisper
        run: python scripts/whisper_bridge.py
