name: process

# Triggered by the Cloudflare Worker via the GitHub "repository_dispatch" API.
# event_type is either "download" or "transcribe" -> available as github.event.action.
on:
  repository_dispatch:
    types: [download, transcribe]

permissions:
  contents: write   # required to create/edit releases and upload assets

concurrency:
  # One run per job id; don't cancel an in-flight job if the same id somehow repeats.
  group: job-${{ github.event.client_payload.job_id }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # stay safely under GitHub's hard 6-hour cap
    env:
      MODE: ${{ github.event.action }}
      URL: ${{ github.event.client_payload.url }}
      QUALITY: ${{ github.event.client_payload.quality }}
      JOB_ID: ${{ github.event.client_payload.job_id }}
      DIARIZE: ${{ github.event.client_payload.diarize }}
      SPEAKERS: ${{ github.event.client_payload.speakers }}
      # Notification. Present only when the user asked to be emailed. NOTIFY_EMAIL is
      # PII on a public repo, so it is masked in "Validate inputs" and never echoed.
      # SITE_URL comes from the Worker (its ALLOWED_ORIGIN), NOT from client input, so
      # the emailed link always points at the real site and cannot be a phishing link.
      NOTIFY_EMAIL: ${{ github.event.client_payload.email }}
      SITE_URL: ${{ github.event.client_payload.site }}
      # Optional cosmetic label for the email (already whitespace-collapsed and length-
      # capped by the Worker). Escaped before it goes into the HTML body.
      JOB_NAME: ${{ github.event.client_payload.name }}
      GH_TOKEN: ${{ github.token }}          # used by the `gh` CLI
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      # The Worker validates these too. Re-checking here is deliberate: both values
      # come from a caller-supplied payload and end up as command arguments.
      # Also publish JOB_ERROR_FILE for every later step: fetch.py / transcribe.py write
      # a one-line user-facing reason there on failure, and "Report failure" turns it
      # into the ERROR.txt the frontend shows. ($RUNNER_TEMP is a built-in runner var;
      # the `runner` context is NOT available in a job-level env: block.)
      - name: Validate inputs
        run: |
          if ! echo "$JOB_ID" | grep -qE '^[A-Za-z0-9-]+$'; then
            echo "::error::Invalid job id"; exit 1
          fi
          if [ -n "$SPEAKERS" ] && ! echo "$SPEAKERS" | grep -qE '^[0-9]{1,2}$'; then
            echo "::error::Invalid speaker count"; exit 1
          fi
          echo "JOB_ERROR_FILE=$RUNNER_TEMP/job_error.txt" >> "$GITHUB_ENV"
          # Keep the recipient out of the public logs. If it is somehow malformed, drop
          # it (skip the notification) rather than failing an otherwise-valid job.
          if [ -n "$NOTIFY_EMAIL" ]; then
            echo "::add-mask::$NOTIFY_EMAIL"
            if ! echo "$NOTIFY_EMAIL" | grep -qE '^[^[:space:]@]+@[^[:space:]@]+\.[^[:space:]@]+$'; then
              echo "Notify email looks invalid; skipping notification."
              echo "NOTIFY_EMAIL=" >> "$GITHUB_ENV"
            fi
          fi

      - uses: actions/checkout@v4

      # Create the release immediately. Its notes are the status channel the frontend
      # polls: `status:` (running/done/error) plus a `stage:` for live progress and the
      # `mode:` so a shared ?job= link can render without prior context.
      - name: Mark job as running
        run: |
          notes=$(printf 'status: running\nstage: preparing\nmode: %s' "$MODE")
          gh release create "job-$JOB_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Job $JOB_ID ($MODE)" \
            --notes "$notes" || echo "release already exists, continuing"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install yt-dlp (latest)
        run: pip install -U yt-dlp

      # Optional anti-bot config for sites that block datacenter IPs. Every branch below
      # is a no-op when its secret/variable is unset, and fetch.py gates on these env
      # vars being present - so an unconfigured repo behaves exactly as before. Nothing
      # here is ever echoed: GitHub masks the raw secret in logs but NOT its decoded form.
      - name: Configure yt-dlp network options
        env:
          YT_COOKIES_B64: ${{ secrets.YT_COOKIES_B64 }}
          YT_PROXY: ${{ secrets.YTDLP_PROXY }}
          YT_PLAYER_CLIENT: ${{ vars.YTDLP_PLAYER_CLIENT }}
        run: |
          if [ -n "$YT_COOKIES_B64" ]; then
            # RUNNER_TEMP, never the workspace: a cookies file under output/ would be
            # swept up by `gh release upload output/*` and published on a public repo.
            cookies="$RUNNER_TEMP/cookies.txt"
            # `tr` strips the line wrapping that `base64` adds by default - without it
            # `base64 -d` rejects otherwise-valid input.
            if ! printf '%s' "$YT_COOKIES_B64" | tr -d '[:space:]' | base64 -d > "$cookies" 2>/dev/null; then
              echo "::error::YT_COOKIES_B64 is not valid base64."
              exit 1
            fi
            chmod 600 "$cookies"
            if [ ! -s "$cookies" ]; then
              echo "::error::YT_COOKIES_B64 decoded to an empty file."
              exit 1
            fi
            echo "COOKIES_FILE=$cookies" >> "$GITHUB_ENV"
            echo "Cookies: configured ($(wc -l < "$cookies") lines)."
          else
            echo "Cookies: not configured."
          fi

          # Proxy URLs often embed credentials, so this stays a secret and is never printed.
          if [ -n "$YT_PROXY" ]; then
            echo "YTDLP_PROXY=$YT_PROXY" >> "$GITHUB_ENV"
            echo "Proxy: configured."
          else
            echo "Proxy: not configured."
          fi

          # Not secret - a repo variable, so it can be changed without a new secret.
          if [ -n "$YT_PLAYER_CLIENT" ]; then
            echo "YTDLP_PLAYER_CLIENT=$YT_PLAYER_CLIENT" >> "$GITHUB_ENV"
            echo "Player client(s): $YT_PLAYER_CLIENT"
          else
            echo "Player client(s): yt-dlp default."
          fi

      - name: Cache Hugging Face models
        if: env.MODE == 'transcribe'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-parakeet-tdt-v3-silero-v1

      # Separate from the Hugging Face cache: these come from sherpa-onnx's GitHub
      # releases, not HF, so they land in ./models rather than ~/.cache/huggingface.
      - name: Cache diarization models
        if: env.DIARIZE == 'true'
        uses: actions/cache@v4
        with:
          path: models
          key: sherpa-diarization-pyannote3-titanet-small-v1

      - name: Install transcription dependencies
        if: env.MODE == 'transcribe'
        run: pip install -r requirements.txt

      - name: Download video
        if: env.MODE == 'download'
        run: |
          gh release edit "job-$JOB_ID" --repo "$GITHUB_REPOSITORY" \
            --notes "$(printf 'status: running\nstage: downloading\nmode: %s' "$MODE")" || true
          python scripts/fetch.py --mode video --url "$URL" --quality "$QUALITY" --out-dir output

      - name: Download audio + transcribe
        if: env.MODE == 'transcribe'
        run: |
          # Update the release notes so the frontend can show the live stage. --notes
          # replaces the whole body; keep status/mode alongside stage each time.
          setstage () {
            gh release edit "job-$JOB_ID" --repo "$GITHUB_REPOSITORY" \
              --notes "$(printf 'status: running\nstage: %s\nmode: %s' "$1" "$MODE")" || true
          }

          setstage downloading
          python scripts/fetch.py --mode audio --url "$URL" --out-dir work

          setstage transcribing
          # An array, not a string: unquoted word-splitting is what makes this kind of
          # conditional-flag plumbing break on empty values.
          extra=()
          if [ "$DIARIZE" = "true" ]; then
            extra=(--diarize --speakers "${SPEAKERS:-0}")
          fi
          python scripts/transcribe.py --input-dir work --out-dir output \
            --models-dir models "${extra[@]}"

      - name: Publish results
        run: |
          # sanitize output filenames so gh doesn't read [brackets]/spaces/quotes as glob patterns
          for f in output/*; do
            [ -e "$f" ] || continue
            d=$(dirname "$f"); b=$(basename "$f")
            safe=$(printf '%s' "$b" | tr -c 'A-Za-z0-9._-' '_')
            if [ "$b" != "$safe" ]; then mv "$f" "$d/$safe"; fi
          done

          # Ensure the release exists (in case "Mark job as running" was skipped) and
          # flip the stage to uploading - still status:running, so the frontend does
          # NOT report done until every asset is up (see the loop below).
          uploading=$(printf 'status: running\nstage: uploading\nmode: %s' "$MODE")
          gh release create "job-$JOB_ID" --repo "$GITHUB_REPOSITORY" \
            --title "Job $JOB_ID ($MODE)" --notes "$uploading" 2>/dev/null \
            || gh release edit "job-$JOB_ID" --repo "$GITHUB_REPOSITORY" --notes "$uploading" || true

          gh release upload "job-$JOB_ID" output/* --repo "$GITHUB_REPOSITORY" --clobber

          # Mark done LAST - this is the authoritative signal the Worker keys on, so it
          # must land only after all assets are uploaded. Retry so a transient edit
          # failure doesn't strand the job as "running" forever.
          done=$(printf 'status: done\nmode: %s' "$MODE")
          for i in 1 2 3; do
            gh release edit "job-$JOB_ID" --repo "$GITHUB_REPOSITORY" --notes "$done" && break
            sleep 2
          done

      # Notify by email if the user asked for it. Best-effort: send_email.py exits 0
      # even if the send fails, so a mail hiccup never marks a finished job as failed.
      # The link is built from SITE_URL (the Worker's own origin) plus the validated
      # JOB_ID, so nothing user-controlled ends up in it.
      - name: Email the result
        if: success() && env.NOTIFY_EMAIL != ''
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          base="${SITE_URL:-https://prompter.neuralforge.tech}"
          link="${base%/}/?job=$JOB_ID"
          if [ "$MODE" = "download" ]; then what="video download"; else what="transcript"; fi
          export EMAIL_TO="$NOTIFY_EMAIL"
          # Optional job name: append to the subject and prepend a "Video:" line. It is
          # already newline-free (Worker collapsed whitespace), so it is header-safe; the
          # HTML copy is escaped.
          if [ -n "$JOB_NAME" ]; then
            export EMAIL_SUBJECT="Your Prompter $what is ready: $JOB_NAME"
            text_name="$(printf 'Video: %s\n\n' "$JOB_NAME")"
            esc_name="$(printf '%s' "$JOB_NAME" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')"
            html_name="<p style=\"font-weight:600\">Video: $esc_name</p>"
          else
            export EMAIL_SUBJECT="Your Prompter $what is ready"
            text_name=""; html_name=""
          fi
          export EMAIL_TEXT="$(printf '%sYour %s is ready.\n\nOpen it here:\n%s\n\nThis link stays available for a few days.\n' "$text_name" "$what" "$link")"
          export EMAIL_HTML="${html_name}<p>Your $what is ready.</p><p><a href=\"$link\">Open your result</a></p><p style=\"color:#6b7280;font-size:13px\">This link stays available for a few days.</p>"
          python scripts/send_email.py

      # If anything above failed, mark the release so the frontend can show an error
      # instead of spinning forever, with the real reason when a script captured one.
      - name: Report failure
        if: failure()
        run: |
          if [ -s "$JOB_ERROR_FILE" ]; then
            cp "$JOB_ERROR_FILE" ERROR.txt
          else
            echo "The job failed. See the Actions logs for details." > ERROR.txt
          fi
          notes=$(printf 'status: error\nmode: %s' "$MODE")
          gh release create "job-$JOB_ID" --repo "$GITHUB_REPOSITORY" \
            --title "Job $JOB_ID ($MODE)" --notes "$notes" 2>/dev/null \
            || gh release edit "job-$JOB_ID" --repo "$GITHUB_REPOSITORY" --notes "$notes" || true
          gh release upload "job-$JOB_ID" ERROR.txt --repo "$GITHUB_REPOSITORY" --clobber || true

      - name: Email the failure
        if: failure() && env.NOTIFY_EMAIL != ''
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          base="${SITE_URL:-https://prompter.neuralforge.tech}"
          link="${base%/}/?job=$JOB_ID"
          reason="The job could not be completed."
          if [ -s "$JOB_ERROR_FILE" ]; then reason="$(cat "$JOB_ERROR_FILE")"; fi
          esc="$(printf '%s' "$reason" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')"
          export EMAIL_TO="$NOTIFY_EMAIL"
          if [ -n "$JOB_NAME" ]; then
            export EMAIL_SUBJECT="Your Prompter job could not be completed: $JOB_NAME"
            text_name="$(printf 'Video: %s\n\n' "$JOB_NAME")"
            esc_name="$(printf '%s' "$JOB_NAME" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')"
            html_name="<p style=\"font-weight:600\">Video: $esc_name</p>"
          else
            export EMAIL_SUBJECT="Your Prompter job could not be completed"
            text_name=""; html_name=""
          fi
          export EMAIL_TEXT="$(printf '%sUnfortunately your job did not finish.\n\nReason: %s\n\nYou can try again here:\n%s\n' "$text_name" "$reason" "$link")"
          export EMAIL_HTML="${html_name}<p>Unfortunately your job did not finish.</p><p><b>Reason:</b> $esc</p><p><a href=\"$link\">Try again</a></p>"
          python scripts/send_email.py
